services:
  postgres:
    image: postgres:18-alpine
    container_name: safenet-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SAFENET@2026
      POSTGRES_DB: safenet_db

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safenet_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: safenet-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:SAFENET%402026@postgres:5432/safenet_db
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "5000:5000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1

    container_name: safenet-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "3000:80"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  postgres_data: